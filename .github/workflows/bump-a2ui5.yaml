# The framework the reproducible builds run against is fixed at the commit in
# A2UI5_PIN (node-setup and the web/Pages build check it out; the nightly e2e
# deliberately stays on main tip as the upstream canary). This workflow moves
# the pin: once a week it resolves abap2UI5 main, rebuilds the full backend at
# that commit, runs the e2e smoke over every port, and opens a PR — so a
# breaking framework change arrives as a red bump PR instead of a broken
# Pages deploy.
name: bump-a2ui5

on:
  schedule:
    - cron: '11 5 * * 2'   # Tuesdays 05:11 UTC, off the full-hour load spikes
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  bump-a2ui5:
    runs-on: ubuntu-latest
    # same full build + smoke the nightly runs, so the same budget (see
    # e2e-nightly.yaml) plus the browser install
    timeout-minutes: 90
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: '22'

    # The abaplint configs pin a RELEASE TAG, not this SHA - abaplint's
    # "branch" key feeds `git clone --branch` and takes a tag or a branch,
    # never a commit. Different question, too: the SHA is what the transpiled
    # backend and the e2e smoke run against, the tag is whether the corpus
    # compiles against the framework its readers installed. Both move here so
    # one weekly pull request carries the whole framework bump.
    - name: Resolve the newest abap2UI5 release and move the abaplint pin
      id: release
      run: |
        set -euo pipefail
        # --exit-code: `git ls-remote` prints nothing and still exits 0 when no
        # ref matches, so a repository that stopped tagging would resolve to an
        # EMPTY version and this step would happily write it.
        TAG=$(git ls-remote --exit-code --tags --refs https://github.com/abap2UI5/abap2UI5 \
              | sed 's#.*refs/tags/##' \
              | sed 's/-702$//' \
              | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' \
              | sort -V | tail -1)
        test -n "$TAG"
        echo "tag=$TAG" >> "$GITHUB_OUTPUT"
        node scripts/check-pins.mjs --set "$TAG"
        node scripts/check-pins.mjs

    - name: Resolve abap2UI5 main and move the pin
      id: pin
      run: |
        set -euo pipefail
        # --exit-code under pipefail: `git ls-remote` prints nothing and still
        # exits 0 for a ref that does not match, so a renamed default branch
        # upstream would resolve to an EMPTY sha and this step would move the
        # pin to nothing. Fail here instead. (web-abap2UI5's build stamp had
        # exactly this hole and went blind for as long as it was there.)
        SHA=$(git ls-remote --exit-code https://github.com/abap2UI5/abap2UI5 refs/heads/main | cut -f1)
        echo "sha=$SHA" >> "$GITHUB_OUTPUT"
        if [ "$SHA" != "$(cat A2UI5_PIN)" ]; then
          echo "$SHA" > A2UI5_PIN
        fi
        # `changed` covers the abaplint pin too - the release tag can move on a
        # week where main did not, and vice versa.
        if git diff --quiet; then
          echo "changed=false" >> "$GITHUB_OUTPUT"
        else
          echo "changed=true" >> "$GITHUB_OUTPUT"
        fi

    # the proof: full build + smoke at the new pin, exactly what node-setup
    # gives a user and what deploy-web will ship.
    #
    # `npm ci` must come FIRST. Without it there is no local playwright, so
    # `npx` fetches the CURRENT release into a temp prefix and installs THAT
    # version's browser build; node-setup then runs its own `npm ci`, which
    # puts the pinned playwright in place, and the smoke asks for a browser
    # build that was never downloaded. That is exactly how the only bump-a2ui5
    # run so far died (2026-08-11: "Executable doesn't exist at
    # …/chromium_headless_shell-1228" right after installing build 1234).
    - if: steps.pin.outputs.changed == 'true'
      run: npm ci
    - if: steps.pin.outputs.changed == 'true'
      run: npx playwright install --with-deps chromium
    - if: steps.pin.outputs.changed == 'true'
      run: node scripts/node-setup.mjs
    - if: steps.pin.outputs.changed == 'true'
      run: node scripts/e2e-smoke.mjs --strict

    - if: steps.pin.outputs.changed == 'true'
      uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
      with:
        branch: bump-a2ui5
        title: 'chore: bump the pinned abap2UI5 framework commit'
        commit-message: 'chore: bump A2UI5_PIN to abap2UI5/abap2UI5@${{ steps.pin.outputs.sha }}'
        body: |
          Weekly re-resolve of the two framework references:

          - `A2UI5_PIN` against abap2UI5 main (`${{ steps.pin.outputs.sha }}`) —
            what node-setup, the Pages build and the e2e smoke run against;
          - the abaplint configs against the newest release
            (`${{ steps.release.outputs.tag }}`) — whether the corpus compiles
            against the framework its readers have installed.

          The nightly e2e keeps testing main tip, so all three questions stay
          separately answered.

          The full backend build and the strict e2e smoke over all ports ran
          at the new pin in the workflow that opened this PR.
        add-paths: |
          A2UI5_PIN
          abaplint.jsonc
          .github/abaplint
        delete-branch: true
