name: abap-702

on:
  pull_request:
  # also on main, so the README badge carries this gate's real verdict -
  # a workflow that never runs on the default branch shows "no status"
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: abap-702-${{ github.ref }}
  cancel-in-progress: true

jobs:
  abap-702:
    runs-on: ubuntu-latest
    # `npm run downport` is abaplint --fix iterating the downport rule to a
    # fixpoint over the whole corpus — ~27 passes at 416 ports, each one a
    # full re-parse, and it grows with every batch. It outgrew the 10 minutes
    # this job used to allow some time ago: EVERY run since then died in that
    # step, so the badge has been reading "cancelled" for a timeout rather
    # than for a v702 finding. The downport rule alone needs ~44 passes and
    # definitions_top then settles one statement per pass over 300+ more, so
    # the whole step measures well over half an hour at 416 ports; 60 leaves
    # room for a few more batches.
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: '22'
        cache: 'npm'
    - run: npm ci
    - run: npm run downport
    - run: npx abaplint .github/abaplint/abap_702.jsonc
