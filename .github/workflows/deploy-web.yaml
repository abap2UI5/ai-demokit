name: deploy-web

# Builds the searchable catalogue (web/search) and deploys it to this repo's
# GitHub Pages. A static page and one generated JSON — a couple of minutes.
#
# It used to be the whole in-browser demo: the abap2UI5 framework and all 430
# ports cloned, downported to 702 with abaplint --fix, transpiled and webpacked
# into a 28 MB bundle that ran the apps client-side. That was removed
# 2026-08-19 (maintainer decision). The downport alone took twenty minutes of
# every deploy, and what it bought — running a port without a system — the
# playground does better and maintains in its own repository: an editor beside
# the app, abaplint and the abap2UI5 linter live, and one UI5 build kept
# current there rather than here. Each result on the page links straight into
# it. If it ever needs to come back, it is one `git revert` away.
#
# This is the ONLY way the site is published: Settings -> Pages -> Source must
# be "GitHub Actions". If you see a red "pages build and deployment" on main:
# that is GitHub's BUILT-IN Jekyll builder, not this workflow, and a leftover
# of the old branch source. It publishes nothing either way — this workflow's
# deploy job is what serves the site. Re-saving the Pages source in Settings
# clears the leftover; do NOT answer it by committing a docs/ folder.

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      # the index is derived from all four: the classes (@keywords, @summary,
      # and the view the linter reconstructs from each builder chain), the
      # sidecars (review state, deviations), ui5/ (titles, descriptions) and
      # the generator itself
      - 'src/**'
      - 'meta/**'
      - 'ui5/descriptions.json'
      - 'ui5/universe.json'
      - 'scripts/generate-search-index.mjs'
      - 'web/**'
      - '.github/workflows/deploy-web.yaml'
  schedule:
    - cron: '0 8 * * *'   # daily; picks up anything merged without touching the paths above

permissions:
  contents: read
  pages: write
  id-token: write

# one Pages deployment at a time; let a newer run supersede an in-flight one
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      # --ignore-scripts skips Playwright's browser download: the index is
      # derived with the linter's render gate off, so no browser is used.
      - name: Install
        run: npm ci --ignore-scripts

      # writes web/search/apps.json, which is not committed — derived, and
      # 350 KB. Regenerated here on every deploy, so the page can never be
      # staler than the repository it describes.
      - name: Search index
        run: node scripts/generate-search-index.mjs

      # The gate this pipeline needs now that there is no build to fail: a page
      # whose data file is missing deploys exactly like a working one — it just
      # shows "the catalogue could not be loaded" to every visitor. Assert the
      # three static files and a non-trivial index before uploading.
      - name: Check the artefact is complete
        run: |
          cd web/search
          for f in index.html search.css search.js apps.json; do
            test -s "$f" || { echo "deploy-web: $f is missing or empty"; exit 1; }
          done
          node -e '
            const x = require("./apps.json");
            if (!Array.isArray(x.apps) || x.apps.length < 400) {
              console.error(`deploy-web: apps.json holds ${x.apps?.length} ports, expected 400+`);
              process.exit(1);
            }
            if (!Array.isArray(x.controls) || !x.controls.length) {
              console.error("deploy-web: apps.json has no control dictionary");
              process.exit(1);
            }
            console.log(`deploy-web: ${x.apps.length} ports, ${x.controls.length} controls`);
          '

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: web/search

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
