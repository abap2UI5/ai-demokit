name: chain-format

# The view-chain layout: one call per line, four spaces per tree level, where
# the end( ) column sits, which blank line carries which piece of structure.
# The abap2UI5-linter judges a chain's own rhythm and one-call-per-line;
# neither rule judges the STEP, so this is the only check that holds the
# four-space level. `npm run fmt:chains` fixes what it reports.
#
# scripts/chain-format.mjs is byte-identical in abap2UI5/samples,
# abap2UI5/samples-stack and here, and it was gated in the first two while
# here it only ever ran from `npm run gates` - not even from the pre-commit
# hook. A layout violation could reach main unseen until 2026-08-18.

on:
  pull_request:
  # also on main, so the README badge carries this gate's real verdict -
  # a workflow that never runs on the default branch shows "no status"
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: chain-format-${{ github.ref }}
  cancel-in-progress: true

jobs:
  chain_format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: '22'
    - run: node scripts/chain-format.mjs
