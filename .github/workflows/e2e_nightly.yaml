name: e2e_nightly

# Runs every port as the REAL app (transpiled abap2UI5 backend + headless
# Chromium, scripts/e2e-build.mjs + e2e-smoke.mjs) — the heavy gate that the
# fast PR `checks` deliberately skip (multi-minute transpile + browser).
# Nightly so LIVE_TEST-class regressions surface within a day instead of at
# the next release: every INTERACTIONS entry that stays green here is a
# LIVE_TEST candidate for closure (STATUS.md open findings).

on:
  workflow_dispatch:
  schedule:
    - cron: '30 2 * * *'   # nightly, 02:30 UTC

permissions:
  contents: read
  issues: write   # the failure channel below — a red nightly used to be visible only in the Actions tab

concurrency:
  group: e2e-nightly
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
    - name: Checkout ai-demokit
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Node.js
      uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
      with:
        node-version: '22'

    - name: Install ai-demokit dependencies
      run: npm ci

    - name: Install Playwright Chromium
      run: npx playwright install --with-deps chromium

    - name: Clone abap2UI5 (transpiler + express runtime)
      run: |
        git clone --depth 1 https://github.com/abap2UI5/abap2UI5.git .abap2UI5
        cd .abap2UI5 && npm ci

    - name: Build the transpiled backend (framework + all ports)
      env:
        A2UI5_HOME: ${{ github.workspace }}/.abap2UI5
      run: npm run e2e:build

    - name: Run every port as the real app
      env:
        A2UI5_HOME: ${{ github.workspace }}/.abap2UI5
      run: node scripts/e2e-smoke.mjs --strict

    # A red nightly is a regression in a LIVE_TEST-class wire — it must reach
    # someone, not sit in the Actions tab until the next release. One issue is
    # kept per breakage (updated, not duplicated) and it references the run.
    #
    # The issue is the PREFERRED channel, not the only one, and it must never be
    # the reason the job is red: issues can be disabled on the repository (they
    # were, from 2026-07-27 to 2026-08-10, so every red nightly reported a
    # `gh` failure on top of the real one and none of them reached anybody).
    # The step summary always gets written, so the verdict survives either way.
    - name: Report the nightly failure
      if: failure()
      continue-on-error: true
      env:
        GH_TOKEN: ${{ github.token }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      run: |
        title="e2e nightly is red"
        body="The nightly e2e smoke failed: ${RUN_URL}

        Every FAIL line in the run log is a port whose live wire regressed (or a harness effect — see .claude/skills/e2e-debugging). This issue is updated by each red nightly and should be closed when the nightly is green again."

        {
          echo "## $title"
          echo
          echo "The nightly e2e smoke failed — every FAIL line in the run log is a port"
          echo "whose live wire regressed (or a harness effect, see"
          echo ".claude/skills/e2e-debugging)."
        } >> "$GITHUB_STEP_SUMMARY"

        if ! existing=$(gh issue list --state open --search "in:title \"$title\"" --json number --jq '.[0].number // empty' 2>&1); then
          echo "::warning::could not reach the issue tracker ($existing) — the step summary above is the only report"
          exit 0
        fi
        if [ -n "$existing" ]; then
          gh issue comment "$existing" --body "Still red: ${RUN_URL}"
        else
          gh issue create --title "$title" --body "$body"
        fi
