name: auto_downport

# Rebuilds the 702 branch: downports the sources, lints with the 702 config
# and force-pushes the result to the 702 branch.

on:
  push:
    branches: [main]

concurrency:
  group: auto_downport
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  auto_downport:
    if: github.repository == 'abap2UI5/samples-controls'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    # same `npm run downport` as ABAP_702, same budget — see the note there.
    # Every run of this workflow had been dying in that step too, which is why
    # the 702 branch stopped being rebuilt.
    timeout-minutes: 45
    steps:
    - name: Checkout Repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: '22'
        cache: 'npm'

    - run: npm ci
    - run: npm run downport
    - run: npx abaplint .github/abaplint/abap_702.jsonc

    - name: Commit and Push Changes
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'
        git add .
        git diff --staged --quiet || git commit -m "Downport changes"
        git push --force origin HEAD:702
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
