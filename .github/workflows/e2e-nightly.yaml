name: e2e-nightly

# Runs every port as the REAL app (transpiled abap2UI5 backend + headless
# Chromium, scripts/e2e-build.mjs + e2e-smoke.mjs) — the heavy gate that the
# fast PR gates deliberately skip (multi-minute transpile + browser).
# Nightly so LIVE_TEST-class regressions surface within a day instead of at
# the next release: every INTERACTIONS entry that stays green here is a
# LIVE_TEST candidate for closure (STATUS.md open findings).

on:
  workflow_dispatch:
  schedule:
    - cron: '30 2 * * *'   # nightly, 02:30 UTC

permissions:
  contents: read
  issues: write   # the failure channel below — a red nightly used to be visible only in the Actions tab

concurrency:
  group: e2e-nightly
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    # Wall clock grows with the corpus: ~19 min transpile + ~4 s per port.
    # At 416 ports the 45 min this job used to allow was already too short —
    # 2026-08-02/04/06/07/10/12 all died mid-smoke as "cancelled", i.e. the
    # badge went grey for a timeout, not for a regression. Sized for roughly
    # twice today's ~40 min so a growing corpus does not silently re-hit it.
    timeout-minutes: 90
    steps:
    - name: Checkout samples-controls
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: '22'

    - name: Install samples-controls dependencies
      run: npm ci

    - name: Install Playwright Chromium
      run: npx playwright install --with-deps chromium

    - name: Clone abap2UI5 (transpiler + express runtime)
      run: |
        git clone --depth 1 https://github.com/abap2UI5/abap2UI5.git .abap2UI5
        cd .abap2UI5 && npm ci

    - name: Build the transpiled backend (framework + all ports)
      env:
        A2UI5_HOME: ${{ github.workspace }}/.abap2UI5
      run: npm run e2e:build

    - name: Run every port as the real app
      env:
        A2UI5_HOME: ${{ github.workspace }}/.abap2UI5
      run: node scripts/e2e-smoke.mjs --strict

    # A red nightly is a regression in a LIVE_TEST-class wire — it must reach
    # someone, not sit in the Actions tab until the next release. One issue is
    # kept per breakage (updated, not duplicated) and it references the run.
    #
    # The issue is the PREFERRED channel, not the only one, and it must never be
    # the reason the job is red: issues are disabled on this repository, so
    # every red nightly failed a second time in `gh issue create` ("the
    # 'abap2UI5/ai-demokit' repository has disabled issues") and none of them
    # reached anybody. The step summary always gets written, so the verdict
    # survives either way; enabling issues restores the tracked channel with no
    # change here.
    - name: Report the nightly failure
      if: failure()
      continue-on-error: true
      env:
        GH_TOKEN: ${{ github.token }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      run: |
        title="e2e nightly is red"
        body="The nightly e2e smoke failed: ${RUN_URL}

        Every FAIL line in the run log is a port whose live wire regressed (or a harness effect — see .claude/skills/e2e-debugging). This issue is updated by each red nightly and should be closed when the nightly is green again."

        {
          echo "## $title"
          echo
          echo "The nightly e2e smoke failed — every FAIL line in the run log is a port"
          echo "whose live wire regressed (or a harness effect, see"
          echo ".claude/skills/e2e-debugging)."
        } >> "$GITHUB_STEP_SUMMARY"

        # stderr goes to a file, NOT into `existing`: the value is used as an
        # issue number below, and a gh warning on a SUCCEEDING call would end up
        # in it just as readily as an error message on a failing one
        gh_err=$(mktemp)
        if ! existing=$(gh issue list --state open --search "in:title \"$title\"" --json number --jq '.[0].number // empty' 2>"$gh_err"); then
          echo "::warning::could not reach the issue tracker ($(tr '\n' ' ' <"$gh_err")) — the step summary above is the only report"
          exit 0
        fi
        if [ -n "$existing" ]; then
          gh issue comment "$existing" --body "Still red: ${RUN_URL}"
        else
          gh issue create --title "$title" --body "$body"
        fi
