# The linter is a git dependency pinned by SHA in package.json (deliberately
# the same SHA the VS Code extension pins, so the two consumers judge by one
# linter state — see STATUS.md). New rules and metadata reach the view gates
# only when the pin moves; this workflow moves it weekly, runs the gate that
# consumes the linter, and opens a PR. Mirrors the extension's bump-linter
# workflow so the two pins advance in the same rhythm.
name: bump_linter

on:
  schedule:
    - cron: '23 6 * * 1'   # Mondays 06:23 UTC — right after the extension's 06:17 bump
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  bump:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
      with:
        node-version: '22'

    - name: Re-pin @abap2ui5/linter to the linter's main
      id: pin
      run: |
        SHA=$(git ls-remote https://github.com/abap2UI5/linter refs/heads/main | cut -f1)
        echo "sha=$SHA" >> "$GITHUB_OUTPUT"
        npm pkg set "devDependencies.@abap2ui5/linter=github:abap2UI5/linter#$SHA"
        if git diff --quiet package.json; then
          echo "changed=false" >> "$GITHUB_OUTPUT"
        else
          echo "changed=true" >> "$GITHUB_OUTPUT"
        fi
    - if: steps.pin.outputs.changed == 'true'
      run: npm install

    # the corpus gate that consumes the linter — a rule regression over the
    # 290+ ports surfaces here, in the PR run, not on main
    - if: steps.pin.outputs.changed == 'true'
      run: npx playwright install --with-deps chromium
    - if: steps.pin.outputs.changed == 'true'
      run: node scripts/view-gates.mjs --strict

    - if: steps.pin.outputs.changed == 'true'
      uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
      with:
        branch: bump-linter
        title: 'chore: bump the pinned abap2UI5-linter commit'
        commit-message: 'chore: bump the pinned abap2UI5-linter commit to ${{ steps.pin.outputs.sha }}'
        body: |
          Weekly re-resolve of the `@abap2ui5/linter` git dependency against
          the linter's main. The strict view gates over the full corpus ran on
          the updated pin in the workflow that opened this PR.

          Note: the VS Code extension pins the same dependency (its own
          bump-linter workflow runs minutes before this one) — merge both
          bumps in the same week to keep the two consumers on one linter
          state.
        add-paths: |
          package.json
          package-lock.json
        delete-branch: true
