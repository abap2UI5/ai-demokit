name: deploy_web

# Rebuilds the in-browser demo (web/ -> transpile + webpack) and deploys it to
# this repo's GitHub Pages. A thin adaptation of abap2UI5/web-abap2UI5's
# build_web workflow, pointed at this repo's ports.
#
# This is the ONLY way the demo is published: Settings -> Pages -> Source
# must be "GitHub Actions". There used to be a second one - a committed
# docs/ folder serving as a zero-CI fallback on branch source - and it cost
# 28 MB of the repository per rebuild while being, at the moment it was
# removed, twelve hours behind src/. A fallback nobody can tell is stale is
# not a fallback.
#
# If you see a red "pages build and deployment" on main: that is GitHub's
# BUILT-IN Jekyll builder, not this workflow, and it is a leftover of the old
# branch source. It chdirs to ./docs, which no longer exists, and fails with
# "No such file or directory @ dir_chdir0 - /github/workspace/docs". It
# publishes nothing either way - this workflow's deploy job is what serves the
# site, and it is green (checked 2026-08-16: deploy-pages succeeded minutes
# after the built-in builder failed on the same commit, which it could not do
# unless the source were already "GitHub Actions"). Re-saving the Pages source
# in Settings clears the leftover; do NOT answer it by committing a docs/
# folder again.

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'web/**'
      - '.github/workflows/deploy_web.yaml'
  schedule:
    - cron: '0 8 * * *'   # daily; picks up merged port changes and A2UI5_PIN bumps (framework is pinned, see bump_a2ui5.yaml)

permissions:
  contents: read
  pages: write
  id-token: write

# one Pages deployment at a time; let a newer run supersede an in-flight one
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      # assemble (clone framework + copy this repo's ports) -> downport ->
      # transpile -> webpack. Produces web/build (the static site).
      - name: Build in-browser bundle
        working-directory: web
        run: |
          npm ci
          npm run build

      # The gate this pipeline did not have. A green build proves nothing here:
      # the transpiler does not fail on an unresolved type or a wrong runtime
      # guard, it emits code that THROWS, so a dead bundle builds and deploys
      # exactly like a working one. Two of them reached the published demo that
      # way (the z2ui5_cl_http_handler rename -> "Void type" on every request,
      # and the dissolve guard swallowing the shipped apps -> 500 BINDING_ERROR
      # on the first roundtrip). Both were one HTTP request away from obvious,
      # and neither needed a browser, so this asks the built backend to answer:
      # GET the bootstrap HTML, POST the first roundtrip, POST an event and get
      # the draft back. It FAILS the run - nothing is deployed untested again.
      - name: Smoke — the built backend answers
        working-directory: web
        run: npm run smoke

      # the transpiled unit run on top (framework + ajson test classes). Kept
      # non-blocking: it exercises the framework's own tests, not this bundle
      - name: Smoke — transpiled unit run
        working-directory: web
        run: node output/index.mjs || echo "unit run reported issues (non-blocking)"

      - name: Bundle for Pages
        working-directory: web
        run: npm run webpack:build

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: web/build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
