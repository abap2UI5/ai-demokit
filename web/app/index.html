<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>abap2UI5 · samples-controls</title>
    <link rel="icon" href="data:," />
    <!-- The root of the site is a switch, not a page.

         ?app_start=<class> boots the transpiled backend and runs that port -
         what the catalogue's "Run here" links, the overview app's launch
         links and every existing bookmark use. Anything else lands on
         /search/, the static catalogue: which port shows X, and does it run
         on your UI5 release.

         The bundle is written here by document.write RATHER than injected by
         HtmlWebpackPlugin (inject: false in webpack.config.js), and that is
         the whole point of the arrangement. A <script src> in the markup is
         found by the browser's preload scanner and fetched while this script
         is still deciding - so a visitor who only wanted to search would
         start pulling 28 MB of transpiled ABAP before being sent away from
         it. Written by script, the tag does not exist until the branch above
         has been taken, and the catalogue costs what the catalogue costs. -->
    <script>
      (function () {
        if (!/[?&]app_start=/.test(location.search)) {
          location.replace('search/' + location.search + location.hash);
          return;
        }
        <% for (const js of htmlWebpackPlugin.files.js) { %>
        document.write('<scr' + 'ipt src="<%= js %>"><\/scr' + 'ipt>');
        <% } %>
      })();
    </script>
</head>
<body>
    <!-- Deliberately empty: web.mjs boots the transpiled ABAP backend and
         document.writes the frontend HTML served by z2ui5_cl_http_handler.
         Any splash content painted here would flash for a split second
         before document.write wipes it, so the page stays blank until the
         real frontend arrives. -->
</body>
</html>
